<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lOGIN </title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">

        <div class="brand-header">
            <div class="logo">✦</div>
            <h1>KALIZ</h1>
            <p class="subtitle"> JOYERÍA</p>
        </div>

        <form class="login-form" action="2.html">
      
            <div class="input-group">
                <label for="doc-type">Tipo de Documento</label>
                <div class="select-wrapper">
                    <select id="doc-type" required>
                        <option value="" disabled selected hidden>Seleccione su documento</option>
                        <option value="CC">Cédula de Ciudadanía</option>
                        <option value="CE">Cédula de Extranjería</option>
                        <option value="PAS">Pasaporte</option>
                        <option value="NIT">NIT (Empresas)</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label for="doc-id">Número de Identificación</label>
                <input type="text" id="doc-id" placeholder="Ingrese su ID" inputmode="numeric" required>
            </div>

            <div class="input-group">
                <div class="password-label-row">
                    <label for="password">Contraseña</label>
                    <a href="#" class="forgot-link">¿Olvidó su contraseña?</a>
                </div>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="remember-group">
                <input type="checkbox" id="remember-me">
                <label for="remember-me">Recordar mis datos</label>
            </div>
            
            <button type="submit" class="btn-submit">INGRESAR</button>
        </a>
        </form>

        <div class="form-footer">
            <p>¿No tiene una cuenta? <a href="inicio.html" class="register-link">Crear una cuenta</a></p>
            
        </div>
    </div>

</body>
</html>
