<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Joyería Kaliz</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">

        <div class="brand-header">
            <div class="logo">✦</div>
            <h1>KALIZ</h1>
            <p class="subtitle">ALTA JOYERÍA</p>
        </div>

   
        <form class="login-form" action="/register" method="POST">
            
           
            <div class="input-group">
                <label for="reg-name">Nombres Completos</label>
                <input type="text" id="reg-name" name="reg-name" placeholder="Ej. Carlos Andrés" required>
            </div>

       
            <div class="input-group">
                <label for="reg-lastname">Apellidos Completos</label>
                <input type="text" id="reg-lastname" name="reg-lastname" placeholder="Ej. Pérez Gómez" required>
            </div>

           
            <div class="form-row">
                <div class="input-group doc-type-col">
                    <label for="reg-doc-type">Tipo</label>
                    <div class="select-wrapper">
                        <select id="reg-doc-type" name="reg-doc-type" required>
                            <option value="CC" selected>CC</option>
                            <option value="CE">CE</option>
                            <option value="PAS">PAS</option>
                        </select>
                    </div>
                </div>
                <div class="input-group doc-id-col">
                    <label for="reg-doc-id">Número de Documento</label>
                    <input type="text" id="reg-doc-id" name="reg-doc-id" placeholder="1018432951" inputmode="numeric" pattern="[0-9]*" required>
                </div>
            </div>

          
            <div class="input-group">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" name="reg-email" placeholder="cperez@email.com" required>
            </div>

            <div class="input-group">
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" name="reg-password" placeholder="Mínimo 8 caracteres" minlength="8" required>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" class="btn-submit">REGISTRARSE</button>
        </form>

        <div class="form-footer">
            <p>¿Ya tiene una cuenta? <a href="index.html" class="register-link">Iniciar sesión</a></p>
        </div>
    </div>

</body>
</html>
